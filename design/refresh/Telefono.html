<!DOCTYPE html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Alma Planet – telefono</title>
<link rel="stylesheet" href="src/tokens.css">
<style>body{margin:0;background:#E9E7E3;font-family:var(--ap-font);color:#2C2C2C}a{color:#E0731A}a:hover{color:#FF8A26}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:16px 32px;background:rgba(233,231,227,.9);backdrop-filter:blur(10px)}
.top h1{margin:0;font-size:22px;font-weight:300}.top h1 b{font-weight:700;color:#FF8A26}.top span{flex:1}
.cmp{display:flex;gap:4px;background:#2C2C2C;border-radius:999px;padding:4px}.cmp button{border:0;background:none;color:#BEBEBC;padding:8px 18px;border-radius:999px;font:500 13px var(--ap-font);cursor:pointer}.cmp button.on{background:#FF8A26;color:#fff}
.grid{display:flex;flex-wrap:wrap;gap:40px 32px;padding:12px 32px 60px;justify-content:center}
figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:12px}
figcaption{font-size:14px;font-weight:500;color:#515151}
.ph{width:390px;height:844px;border-radius:52px;background:#1A1A1A;padding:12px;box-shadow:0 30px 60px -30px rgba(0,0,0,.5);position:relative}
.ph::before{content:"";position:absolute;top:22px;left:50%;width:110px;height:30px;margin-left:-55px;background:#1A1A1A;border-radius:20px;z-index:2}
.ph iframe{width:366px;height:820px;border:0;border-radius:40px;background:#F7F6F3;display:block}</style></head><body>
<div class="top"><h1>Alma Planet · <b>telefono</b></h1><span></span><div class="cmp"><button type="button" data-v="0">Prima</button><button type="button" data-v="1" class="on">Dopo</button></div></div>
<div class="grid" id="g"></div>
<script>
const S=[['home','Home'],['notifications','Notifiche'],['me','Profilo'],['mine','I miei ticket'],['tickets','Tutti i ticket'],['rda','RDA interne'],['projects','Progetti'],['calendar','Calendario'],['drive','OneDrive'],['direct','Chat · elenco'],['chat','Chat · conversazione'],['org','Organigramma']];
const g=document.getElementById('g');
g.innerHTML=S.map(([k,l])=>`<figure><div class="ph"><iframe src="index.html?embed=1#${k}" title="${l}" loading="lazy"></iframe></div><figcaption>${l}</figcaption></figure>`).join('');
let after=true;
const apply=f=>{try{const d=f.contentDocument;const l=d&&d.getElementById('rf');if(l)l.disabled=!after}catch(e){}};
g.querySelectorAll('iframe').forEach(f=>f.addEventListener('load',()=>apply(f)));
document.querySelector('.cmp').onclick=e=>{const b=e.target.closest('button');if(!b)return;after=b.dataset.v==='1';document.querySelectorAll('.cmp button').forEach(x=>x.classList.toggle('on',x===b));g.querySelectorAll('iframe').forEach(apply)};
</script></body></html>
