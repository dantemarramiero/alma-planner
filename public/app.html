<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Alma Planner</title>
  <link rel="icon" href="/img/favicon-64.png" type="image/png">
  <link rel="apple-touch-icon" href="/img/almacis-mark.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/vendor/frappe-gantt/frappe-gantt.css">
  <link rel="stylesheet" href="/css/app.css">
  <link rel="stylesheet" href="/css/intranet.css">
  <link rel="stylesheet" href="/css/project-emails.css">
  <link rel="stylesheet" href="/css/notes.css">
  <link rel="stylesheet" href="/css/org.css">
  <link rel="stylesheet" href="/css/teams.css">
  <link rel="stylesheet" href="/css/projects.css">
  <link rel="stylesheet" href="/css/mobile.css">
  <script src="/vendor/frappe-gantt/frappe-gantt.umd.js"></script>
  <script src="/vendor/fullcalendar/index.global.min.js"></script>
  <script src="/vendor/fullcalendar-locales/it.global.min.js"></script>
  <script type="module" src="/js/main.js"></script>
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <a class="brand brand-full" href="#/" aria-label="Alma Planner"><img class="brand-logo" src="/img/almacis-logo.png" alt="Almacis"><span class="brand-app">Planner</span></a>
      <nav class="nav">
        <span class="nav-label">Intranet</span>
        <a href="#/" data-nav="home"><span class="nav-ico">⌂</span>Home</a>
        <a href="#/notifications" data-nav="notifications"><span class="nav-ico">♡</span>Notifiche<span class="nav-badge" data-badge="notifications" hidden></span></a>
        <a href="#/" data-nav="me"><span class="nav-ico">◉</span>Profilo</a>
        <button class="nav-create" id="create" type="button"><span class="nav-ico">＋</span>Crea un post</button>
        <span class="nav-label">Planner</span>
        <a href="#/mine" data-nav="mine"><span class="nav-ico">◎</span>I miei ticket</a>
        <a href="#/tickets" data-nav="tickets"><span class="nav-ico">☰</span>Tutti i ticket</a>
        <a href="#/projects" data-nav="projects"><span class="nav-ico">▣</span>Progetti</a>
        <a href="#/gantt" data-nav="gantt"><span class="nav-ico">▤</span>Gantt</a>
        <a href="#/calendar" data-nav="calendar"><span class="nav-ico">▦</span>Calendario</a>
        <a href="#/drive" data-nav="drive"><span class="nav-ico">☁</span>OneDrive</a>
        <a href="#/direct" data-nav="direct"><span class="nav-ico">✉</span>Chat<span class="nav-badge" data-badge="direct" hidden></span></a>
        <a href="#/chat" data-nav="chat" id="nav-chat" hidden><span class="nav-ico">✉</span>Chat interna<span class="nav-badge" data-badge="internal" hidden></span></a>
        <a href="#/org" data-nav="org"><span class="nav-ico">⧉</span>Organigramma</a>
      </nav>
      <div class="sidebar-foot">
        <div class="me" id="me"></div>
        <button class="btn btn-ghost btn-sm" id="logout" type="button">Esci</button>
      </div>
    </aside>
    <!-- Sul telefono: barra in alto (notifiche, chat, menu) e barra in basso a cinque tasti, come Instagram -->
    <header class="m-top">
      <a class="brand" href="#/"><img class="brand-mark-img" src="/img/almacis-mark.png" alt=""><span>Alma</span></a>
      <div class="m-icons">
        <a class="m-ico" href="#/notifications" data-nav="notifications" aria-label="Notifiche">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21l7.8-7.5 1-1.1a5.5 5.5 0 0 0 0-7.8z"/></svg>
          <span class="nav-badge" data-badge="notifications" hidden></span>
        </a>
        <a class="m-ico" href="#/direct" data-nav="direct" aria-label="Chat">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.7 11.5a8.4 8.4 0 0 1-12.3 7.5L3 21l2-5.3a8.5 8.5 0 1 1 15.7-4.2z"/></svg>
          <span class="nav-badge" data-badge="direct" hidden></span>
        </a>
        <button class="m-ico" id="m-menu" type="button" aria-label="Menu">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
      </div>
    </header>
    <main class="main">
      <div class="backbar" id="backbar" hidden><button class="back-btn" id="back" type="button" aria-label="Torna alla pagina precedente">← Indietro</button></div>
      <div id="view" tabindex="-1"></div>
    </main>
    <nav class="m-tabs" aria-label="Menu principale">
      <a class="m-tab" href="#/" data-nav="home" aria-label="Home">
        <svg class="ico-off" width="27" height="27" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3z"/></svg>
        <svg class="ico-on" width="27" height="27" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3z"/></svg>
      </a>
      <a class="m-tab" href="#/mine" data-nav="mine" aria-label="I miei ticket">
        <svg class="ico-off" width="27" height="27" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><path d="m8 12 3 3 5-6"/></svg>
        <svg class="ico-on" width="27" height="27" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5" fill="currentColor" stroke="currentColor"/><path d="m8 12 3 3 5-6" stroke="#fff" stroke-width="2.2"/></svg>
      </a>
      <button class="m-tab m-plus" id="m-create" type="button" aria-label="Crea">
        <span><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></span>
      </button>
      <a class="m-tab" href="#/calendar" data-nav="calendar" aria-label="Calendario">
        <svg class="ico-off" width="27" height="27" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
        <svg class="ico-on" width="27" height="27" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3" fill="currentColor" stroke="currentColor"/><path d="M3 10h18" stroke="#fff"/><path d="M8 3v4M16 3v4" stroke="currentColor"/></svg>
      </a>
      <a class="m-tab m-me" href="#/" data-nav="me" id="m-me" aria-label="Profilo"></a>
    </nav>
  </div>
  <div id="overlay-root"></div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
</body>
</html>
